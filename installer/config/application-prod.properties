# ========================================================
# RESTAURANT POS — PRODUCTION CONFIGURATION (OFFLINE DESKTOP)
# ========================================================

# Server Configuration (Listen on 0.0.0.0 so LAN client terminals can connect)
server.port=8080
server.address=0.0.0.0
server.compression.enabled=true

# Local PostgreSQL Connection (Port 5433)
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/pos
spring.datasource.username=pos_user
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.pool-name=POS-Local-Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=false

# Flyway Migrations (Automatic startup migration)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# Local Storage Directories (Standard %ProgramData% locations)
app.upload.dir=C:/ProgramData/RestaurantPOS/uploads
logging.file.name=C:/ProgramData/RestaurantPOS/logs/app.log
app.backup.path=C:/ProgramData/RestaurantPOS/backups

# Logging
logging.level.root=INFO
logging.level.com.restaurantpos=INFO
logging.level.org.hibernate.SQL=WARN
logging.file.max-size=50MB
logging.file.max-history=15

# Security & CORS
spring.security.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:8080,http://localhost:8080,file://

# Actuator Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true
