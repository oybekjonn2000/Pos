<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Restaurant POS — Yuklanmoqda</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: linear-gradient(135deg, #0b0d14 0%, #131724 50%, #1a1f33 100%);
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 12px;
      padding: 32px;
    }
    .logo-container {
      position: relative;
      margin-bottom: 24px;
    }
    .logo-glow {
      position: absolute;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.4) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 2s infinite ease-in-out;
    }
    .logo-icon {
      font-size: 54px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 4px 12px rgba(99, 102, 241, 0.5));
    }
    .brand-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #c7d2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .brand-subtitle {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 400;
      margin-bottom: 32px;
      letter-spacing: 0.3px;
    }
    .progress-wrapper {
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 100px;
      height: 8px;
      padding: 2px;
      overflow: hidden;
      margin-bottom: 16px;
      position: relative;
    }
    .progress-bar {
      height: 100%;
      width: 25%;
      background: linear-gradient(90deg, #6366f1 0%, #818cf8 50%, #a5b4fc 100%);
      border-radius: 100px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.6);
    }
    .status-text {
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 500;
      min-height: 20px;
      text-align: center;
      transition: opacity 0.2s ease;
    }
    .version-tag {
      position: absolute;
      bottom: 14px;
      font-size: 11px;
      color: #475569;
      letter-spacing: 0.5px;
    }
    .error-box {
      display: none;
      margin-top: 16px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 10px 16px;
      border-radius: 8px;
      color: #fca5a5;
      font-size: 12px;
      max-width: 380px;
      text-align: center;
    }
    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.9; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-glow"></div>
    <div class="logo-icon">
      <svg class="pos-icon" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--icon-color, #A9BCE6);">
        <path d="M18 2v6a3 3 0 0 1-3 3 3 3 0 0 1-3-3V2"></path>
        <path d="M15 2v20"></path>
        <path d="M6 2v7a3 3 0 0 0 3 3 3 3 0 0 0 3-3V2"></path>
        <path d="M9 12v10"></path>
      </svg>
    </div>
  </div>

  <h1 class="brand-title">Restaurant POS</h1>
  <p class="brand-subtitle">Professional Restoran Boshqaruv Tizimi</p>

  <div class="progress-wrapper">
    <div id="progressBar" class="progress-bar"></div>
  </div>

  <div id="statusText" class="status-text">Tizim ishga tushirilmoqda...</div>

  <div id="errorBox" class="error-box"></div>

  <div class="version-tag">v1.0.0 &bull; Standalone Edition</div>

  <script>
    window.electronAPI?.onSplashStatus?.((status) => {
      if (!status) return;
      const bar = document.getElementById('progressBar');
      const text = document.getElementById('statusText');
      const err = document.getElementById('errorBox');

      if (status.step) {
        if (status.step === 1) bar.style.width = '30%';
        if (status.step === 2) bar.style.width = '65%';
        if (status.step === 3) bar.style.width = '95%';
        if (status.step === 4) bar.style.width = '100%';
      }
      if (status.message) {
        text.innerText = status.message;
      }
      if (status.error) {
        err.style.display = 'block';
        err.innerText = status.error;
      }
    });
  </script>
</body>
</html>
